<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天坑-卡厄兰</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap');

    :root {
      --ink: #2c1a0e;
      --muted: #7a5c3a;
      --line: rgba(80, 45, 15, 0.22);
      --panel: rgba(42, 28, 14, 0.82);
      --paper: #1e1208;
      --accent: #c8943a;
      --gold: #d4a843;
      --parchment: #e8d5a3;
      --border-dark: #5c3a1a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--parchment);
      font-family: "IM Fell English", "Microsoft YaHei", "PingFang SC", "Times New Roman", serif;
      background: #0e0a04;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 560px;
      display: grid;
      grid-template-columns: 1fr;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .topbar {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 5;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      pointer-events: none;
    }

    .brand {
      pointer-events: auto;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4.2vw, 42px);
      line-height: 1.0;
      letter-spacing: 0.04em;
      font-weight: normal;
      color: var(--gold);
      text-shadow:
        0 0 18px rgba(212, 168, 67, 0.55),
        0 2px 4px rgba(0,0,0,0.8);
    }

    /* Decorative divider under title */
    .brand::after {
      content: "⸻✦⸻";
      display: block;
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.15em;
      margin-top: 4px;
      opacity: 0.7;
    }

    .meta {
      margin-top: 6px;
      font-size: 12px;
      color: #a07850;
      white-space: nowrap;
      font-style: italic;
    }

    .toolbar {
      pointer-events: auto;
      width: min(520px, calc(100vw - 36px));
      padding: 14px;
      display: grid;
      gap: 12px;
      background:
        linear-gradient(160deg, rgba(38, 22, 8, 0.95), rgba(28, 15, 5, 0.97));
      border: 1px solid var(--border-dark);
      border-top: 2px solid var(--gold);
      box-shadow:
        0 0 0 1px rgba(212, 168, 67, 0.15),
        0 20px 50px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(212, 168, 67, 0.12);
      border-radius: 2px;
      position: relative;
    }

    /* Corner ornaments on toolbar */
    .toolbar::before,
    .toolbar::after {
      content: "✦";
      position: absolute;
      top: 6px;
      font-size: 9px;
      color: var(--gold);
      opacity: 0.6;
    }
    .toolbar::before { left: 8px; }
    .toolbar::after { right: 8px; }

    .palette {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
      gap: 8px;
    }

    .swatch {
      width: 100%;
      aspect-ratio: 1;
      min-height: 36px;
      border: 1px solid rgba(212, 168, 67, 0.25);
      border-radius: 2px;
      padding: 0;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4);
      transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
    }

    .swatch[aria-pressed="true"] {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(212, 168, 67, 0.4), 0 0 8px rgba(212, 168, 67, 0.3), inset 0 0 0 1px rgba(255, 220, 100, 0.3);
      transform: translateY(-1px);
    }

    .add-swatch {
      display: grid;
      place-items: center;
      color: var(--gold);
      background:
        linear-gradient(135deg, rgba(50, 30, 8, 0.8), rgba(35, 20, 5, 0.8)),
        repeating-linear-gradient(45deg, rgba(212, 168, 67, 0.04) 0 4px, transparent 4px 8px);
    }

    .editor {
      display: grid;
      grid-template-columns: minmax(92px, 1fr) auto auto auto;
      gap: 8px;
      align-items: center;
    }

    .name-field {
      height: 36px;
      min-width: 0;
      border: 1px solid var(--border-dark);
      border-radius: 2px;
      padding: 0 11px;
      color: var(--parchment);
      background: rgba(20, 10, 3, 0.85);
      outline: none;
      font-family: inherit;
      font-style: italic;
    }

    .name-field:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(212, 168, 67, 0.2), 0 0 8px rgba(212, 168, 67, 0.15);
    }

    .icon-button {
      width: 36px;
      height: 36px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--border-dark);
      border-radius: 2px;
      color: var(--parchment);
      background: linear-gradient(160deg, rgba(50, 28, 8, 0.9), rgba(30, 16, 4, 0.95));
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease, border-color 150ms ease;
    }

    .icon-button:hover {
      transform: translateY(-1px);
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 8px rgba(212, 168, 67, 0.25);
    }

    .icon-button[aria-pressed="true"] {
      color: var(--gold);
      border-color: var(--gold);
      background: linear-gradient(160deg, rgba(80, 45, 10, 0.95), rgba(50, 28, 5, 0.98));
      box-shadow: 0 0 0 2px rgba(212, 168, 67, 0.25), 0 0 10px rgba(212, 168, 67, 0.2);
    }

    .toolbar[aria-disabled="true"] {
      opacity: 0.45;
    }

    .toolbar[aria-disabled="true"] button,
    .toolbar[aria-disabled="true"] input {
      cursor: not-allowed;
    }

    .readonly-view .toolbar,
    .readonly-view .meta,
    .readonly-view .status {
      display: none;
    }

    .readonly-view .topbar {
      right: auto;
    }

    .icon {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .status {
      position: absolute;
      left: 18px;
      bottom: 16px;
      z-index: 4;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      pointer-events: none;
    }

    .pill {
      min-height: 28px;
      padding: 5px 10px;
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(212, 168, 67, 0.2);
      border-radius: 2px;
      font-size: 12px;
      color: #a07850;
      background: rgba(20, 10, 3, 0.78);
      font-style: italic;
    }

    @media (max-width: 760px) {
      .app {
        min-height: 620px;
      }

      .topbar {
        top: 12px;
        left: 12px;
        right: 12px;
        display: grid;
      }

      .toolbar {
        width: 100%;
      }

      .meta {
        white-space: normal;
      }

      .status {
        left: 12px;
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <canvas id="field" aria-label="三角形颜色地块"></canvas>

    <section class="topbar">
      <div class="brand">
        <h1>天坑-卡厄兰</h1>
        <div class="meta" id="meta">0 个地块已着色</div>
      </div>

      <div class="toolbar" aria-label="颜色工具">
        <div class="palette" id="palette"></div>
        <div class="editor">
          <input class="name-field" id="colorName" aria-label="颜色名" maxlength="12" autocomplete="off">
          <button class="icon-button" id="pickColor" type="button" title="更换颜色">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 22a7 7 0 0 0 7-7c0-4.5-7-13-7-13S5 10.5 5 15a7 7 0 0 0 7 7Z"></path>
            </svg>
          </button>
          <button class="icon-button" id="eraser" type="button" title="橡皮擦" aria-pressed="false">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 21h10"></path>
              <path d="M18.5 10.5 13 5 4.5 13.5a3 3 0 0 0 0 4.2l2.8 2.8h5.4l5.8-5.8a3 3 0 0 0 0-4.2Z"></path>
              <path d="M9.5 8.5 15.5 14.5"></path>
            </svg>
          </button>
          <button class="icon-button" id="clearAll" type="button" title="清空">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18"></path>
              <path d="M8 6V4h8v2"></path>
              <path d="M6 6l1 16h10l1-16"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
            </svg>
          </button>
          <button class="icon-button" id="exportMap" type="button" title="导出地图数据">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12"></path>
              <path d="M7 10l5 5 5-5"></path>
              <path d="M5 21h14"></path>
            </svg>
          </button>
          <button class="icon-button" id="importMap" type="button" title="导入地图Markdown">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21V9"></path>
              <path d="M7 14l5-5 5 5"></path>
              <path d="M5 3h14"></path>
            </svg>
          </button>
          <input id="nativeColor" type="color" value="#0f766e" hidden>
          <input id="mapFile" type="file" accept=".md" hidden>
        </div>
      </div>
    </section>

    <div class="status">
      <span class="pill" id="hoverInfo">悬停: -</span>
      <span class="pill" id="regionInfo">色块组: 0</span>
    </div>
  </main>

  <script>
    const canvas = document.querySelector("#field");
    const ctx = canvas.getContext("2d");
    const paletteEl = document.querySelector("#palette");
    const nameInput = document.querySelector("#colorName");
    const nativeColor = document.querySelector("#nativeColor");
    const pickColorButton = document.querySelector("#pickColor");
    const eraserButton = document.querySelector("#eraser");
    const clearButton = document.querySelector("#clearAll");
    const exportMapButton = document.querySelector("#exportMap");
    const importMapButton = document.querySelector("#importMap");
    const mapFileInput = document.querySelector("#mapFile");
    const metaEl = document.querySelector("#meta");
    const hoverInfo = document.querySelector("#hoverInfo");
    const regionInfo = document.querySelector("#regionInfo");

    const markdownPath = "../data/map.md";
    const localDraftKey = "caerland-map-draft-v2";
    const readOnly = new URLSearchParams(window.location.search).get("readonly") === "1";
    const basePalette = [
      { color: "#0f766e", name: "青绿" },
      { color: "#bc6149", name: "陶土" },
      { color: "#d39a23", name: "金黄" },
      { color: "#4169a8", name: "湖蓝" },
      { color: "#8a5d9f", name: "藤紫" },
      { color: "#4f6f38", name: "苔绿" }
    ];

    const state = {
      palette: structuredClone(basePalette),
      selected: 0,
      tool: "paint",
      isPainting: false,
      lastPaintedKey: null,
      cells: new Map(),
      triangles: [],
      hoverId: null,
      pointer: { x: -9999, y: -9999 },
      dpr: 1,
      width: 0,
      height: 0,
      columns: 0,
      rows: 0,
      side: 44,
      triHeight: 38
    };

    // Intro animation state
    const anim = {
      running: false,
      startTime: 0,
      duration: 1600,   // total animation ms
      waveDuration: 900, // each triangle's own fade-in duration ms
      maxDist: 0        // max distance from center, set after buildTriangles
    };

    async function loadState() {
      try {
        const draft = !readOnly ? localStorage.getItem(localDraftKey) : null;
        const saved = draft ? JSON.parse(draft) : await fetchMarkdownJson(markdownPath, { palette: null, cells: {} });
        if (!saved) return;
        if (Array.isArray(saved.palette) && saved.palette.length) {
          state.palette = saved.palette.map((item, index) => ({
            color: item.color || basePalette[index % basePalette.length].color,
            name: item.name || basePalette[index % basePalette.length].name
          }));
        }
        if (saved.cells && typeof saved.cells === "object") {
          state.cells = new Map(Object.entries(saved.cells).map(([key, value]) => [key, Number(value)]));
        }
      } catch (error) {
        console.error(error);
      }
    }

    function saveState() {
      if (readOnly) return;
      localStorage.setItem(localDraftKey, JSON.stringify(currentMapData()));
    }

    function currentMapData() {
      return {
        palette: state.palette,
        cells: Object.fromEntries(state.cells.entries())
      };
    }

    async function fetchMarkdownJson(url, fallback) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`无法读取 ${url}`);
      return parseMarkdownJson(await response.text(), fallback);
    }

    function parseMarkdownJson(markdown, fallback) {
      const match = markdown.match(/```json\s*([\s\S]*?)\s*```/i);
      if (!match) return fallback;
      return JSON.parse(match[1]);
    }

    function markdownFor(title, data) {
      return `# ${title}\n\nStatic data for GitHub Pages.\n\n\`\`\`json\n${JSON.stringify(data, null, 2)}\n\`\`\`\n`;
    }

    function downloadMarkdown(fileName, title, data) {
      const blob = new Blob([markdownFor(title, data)], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      link.click();
      URL.revokeObjectURL(url);
    }

    function resize() {
      state.dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      canvas.width = Math.floor(state.width * state.dpr);
      canvas.height = Math.floor(state.height * state.dpr);
      canvas.style.width = `${state.width}px`;
      canvas.style.height = `${state.height}px`;
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

      const density = state.width < 760 ? 34 : 42;
      state.side = density;
      state.triHeight = Math.sin(Math.PI / 3) * density;
      state.columns = Math.ceil(state.width / (state.side / 2)) + 4;
      state.rows = Math.ceil(state.height / state.triHeight) + 4;
      buildTriangles();
      if (!anim.running) render();
    }

    function buildTriangles() {
      state.triangles = [];
      const half = state.side / 2;
      const height = state.triHeight;
      let id = 0;

      for (let row = -2; row < state.rows; row++) {
        for (let col = -2; col < state.columns; col++) {
          const x = col * half;
          const y = row * height;
          const up = (row + col) % 2 === 0;
          const points = up
            ? [{ x, y: y + height }, { x: x + half, y }, { x: x + state.side, y: y + height }]
            : [{ x, y }, { x: x + state.side, y }, { x: x + half, y: y + height }];
          const center = {
            x: (points[0].x + points[1].x + points[2].x) / 3,
            y: (points[0].y + points[1].y + points[2].y) / 3
          };
          const key = `${row}:${col}`;
          state.triangles.push({ id: id++, key, row, col, up, points, center });
        }
      }

      // Compute distance of each triangle from screen center for wave animation
      const cx = state.width / 2;
      const cy = state.height / 2;
      let maxDist = 0;
      for (const t of state.triangles) {
        t.distFromCenter = Math.hypot(t.center.x - cx, t.center.y - cy);
        if (t.distFromCenter > maxDist) maxDist = t.distFromCenter;
      }
      anim.maxDist = maxDist;
    }

    function drawTriangle(triangle, fill, stroke, scale) {
      const center = triangle.center;
      ctx.beginPath();
      triangle.points.forEach((point, index) => {
        const x = center.x + (point.x - center.x) * scale;
        const y = center.y + (point.y - center.y) * scale;
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = scale > 1.02 ? 1.35 : 0.8;
      ctx.stroke();
    }

    function render() {
      ctx.clearRect(0, 0, state.width, state.height);

      // Dark parchment / aged map background
      ctx.fillStyle = "#0e0905";
      ctx.fillRect(0, 0, state.width, state.height);

      // Vignette overlay
      const vignette = ctx.createRadialGradient(
        state.width / 2, state.height / 2, state.height * 0.2,
        state.width / 2, state.height / 2, state.height * 0.85
      );
      vignette.addColorStop(0, "rgba(0,0,0,0)");
      vignette.addColorStop(1, "rgba(0,0,0,0.65)");

      // Determine animation progress
      const now = performance.now();
      const animElapsed = anim.running ? now - anim.startTime : Infinity;
      const animDone = animElapsed >= anim.duration + anim.waveDuration;

      for (const triangle of state.triangles) {
        // Per-triangle intro scale
        let introScale = 1;
        if (!animDone) {
          // Wave front: each triangle starts fading in based on its distance from center
          const waveDelay = (triangle.distFromCenter / anim.maxDist) * anim.duration;
          const localT = (animElapsed - waveDelay) / anim.waveDuration;
          if (localT <= 0) {
            introScale = 0;
          } else if (localT < 1) {
            // Ease out elastic-ish: overshoot then settle
            const t = Math.min(localT, 1);
            const ease = 1 - Math.pow(1 - t, 3);
            // Slight overshoot bounce
            introScale = ease < 0.85
              ? ease * 1.18
              : 1 + (1 - ease) * 0.18;
            introScale = Math.max(0, introScale);
          }
        }

        if (introScale === 0) continue;

        const paletteIndex = state.cells.get(triangle.key);
        const color = paletteIndex !== undefined ? state.palette[paletteIndex]?.color : null;
        const distance = Math.hypot(triangle.center.x - state.pointer.x, triangle.center.y - state.pointer.y);
        const lift = Math.max(0, 1 - distance / 145);
        const hoverScale = 1 + Math.pow(lift, 1.35) * 0.34;
        const scale = introScale * hoverScale;

        const fill = color
          ? withAlpha(color, 0.78)
          : "rgba(30, 18, 7, 0.55)";
        const stroke = color
          ? withAlpha(darken(color, 0.38), 0.55)
          : "rgba(212, 168, 67, 0.07)";
        drawTriangle(triangle, fill, stroke, scale);
      }

      // Apply vignette on top
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, state.width, state.height);

      drawRegionNames();
      updateStats();

      // Continue animation loop if still running
      if (!animDone) {
        requestAnimationFrame(render);
      } else {
        anim.running = false;
      }
    }

    function withAlpha(hex, alpha) {
      const rgb = hexToRgb(hex);
      return `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha})`;
    }

    function darken(hex, amount) {
      const rgb = hexToRgb(hex);
      const mix = (value) => Math.max(0, Math.round(value * amount));
      return rgbToHex(mix(rgb.r), mix(rgb.g), mix(rgb.b));
    }

    function hexToRgb(hex) {
      const clean = hex.replace("#", "");
      const value = parseInt(clean.length === 3 ? clean.split("").map((c) => c + c).join("") : clean, 16);
      return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }

    function rgbToHex(r, g, b) {
      return `#${[r, g, b].map((value) => value.toString(16).padStart(2, "0")).join("")}`;
    }

    function drawRegionNames() {
      const groups = findColorGroups();
      regionInfo.textContent = `色块组: ${groups.length}`;
      for (const group of groups) {
        const item = state.palette[group.paletteIndex];
        if (!item?.name) continue;

        const center = groupCenter(group.cells);
        ctx.save();
        ctx.font = "italic 700 13px 'IM Fell English', 'Microsoft YaHei', serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const label = item.name.slice(0, 12);
        const metrics = ctx.measureText(label);
        const paddingX = 10;
        const width = metrics.width + paddingX * 2;
        const height = 24;
        const x = clamp(center.x - width / 2, 8, state.width - width - 8);
        const y = clamp(center.y - height / 2, 72, state.height - height - 20);

        // Parchment-style label background
        roundRect(x, y, width, height, 1);
        ctx.fillStyle = "rgba(18, 10, 3, 0.82)";
        ctx.fill();
        ctx.strokeStyle = withAlpha(darken(item.color, 0.55), 0.65);
        ctx.lineWidth = 1;
        ctx.stroke();

        // Gold text
        ctx.fillStyle = "#d4a843";
        ctx.shadowColor = "rgba(0,0,0,0.9)";
        ctx.shadowBlur = 3;
        ctx.fillText(label, x + width / 2, y + height / 2 + 0.5);
        ctx.restore();
      }
    }

    function roundRect(x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function findColorGroups() {
      const byKey = new Map(state.triangles.map((triangle) => [triangle.key, triangle]));
      const visited = new Set();
      const groups = [];

      for (const [key, paletteIndex] of state.cells.entries()) {
        if (visited.has(key) || !byKey.has(key)) continue;
        const stack = [key];
        const cells = [];
        visited.add(key);

        while (stack.length) {
          const current = stack.pop();
          const triangle = byKey.get(current);
          if (!triangle) continue;
          cells.push(triangle);

          for (const nextKey of neighborKeys(triangle)) {
            if (visited.has(nextKey)) continue;
            if (state.cells.get(nextKey) !== paletteIndex) continue;
            visited.add(nextKey);
            stack.push(nextKey);
          }
        }

        groups.push({ paletteIndex, cells });
      }

      return groups;
    }

    function neighborKeys(triangle) {
      const { row, col, up } = triangle;
      const vertical = up ? row - 1 : row + 1;
      return [`${row}:${col - 1}`, `${row}:${col + 1}`, `${vertical}:${col}`];
    }

    function groupCenter(cells) {
      let totalWeight = 0;
      let x = 0;
      let y = 0;
      for (const cell of cells) {
        const weight = Math.max(1, 220 - Math.hypot(cell.center.x - state.width / 2, cell.center.y - state.height / 2) * 0.02);
        totalWeight += weight;
        x += cell.center.x * weight;
        y += cell.center.y * weight;
      }
      return { x: x / totalWeight, y: y / totalWeight };
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function locateTriangle(x, y) {
      let nearest = null;
      let nearestDistance = Infinity;
      for (const triangle of state.triangles) {
        const d = Math.hypot(triangle.center.x - x, triangle.center.y - y);
        if (d < nearestDistance) {
          nearestDistance = d;
          nearest = triangle;
        }
      }
      return nearest && pointInTriangle({ x, y }, nearest.points) ? nearest : null;
    }

    function pointInTriangle(point, points) {
      const [a, b, c] = points;
      const area = triangleArea(a, b, c);
      const a1 = triangleArea(point, b, c);
      const a2 = triangleArea(a, point, c);
      const a3 = triangleArea(a, b, point);
      return Math.abs(area - (a1 + a2 + a3)) < 0.8;
    }

    function triangleArea(a, b, c) {
      return Math.abs((a.x * (b.y - c.y) + b.x * (c.y - a.y) + c.x * (a.y - b.y)) / 2);
    }

    function setSelected(index) {
      if (readOnly) return;
      state.selected = index;
      state.tool = "paint";
      nameInput.value = state.palette[index].name;
      nativeColor.value = state.palette[index].color;
      renderPalette();
      updateToolState();
      render();
    }

    function addColor() {
      if (readOnly) return;
      const nextIndex = state.palette.length + 1;
      const color = niceColor(nextIndex);
      state.palette.push({ color, name: `颜色${nextIndex}` });
      state.selected = state.palette.length - 1;
      state.tool = "paint";
      saveState();
      setSelected(state.selected);
    }

    function niceColor(seed) {
      const hue = (seed * 47 + 12) % 360;
      return hslToHex(hue, 62, 56);
    }

    function hslToHex(h, s, l) {
      s /= 100;
      l /= 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = l - c / 2;
      const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
      return rgbToHex(Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255));
    }

    function setEraser(enabled) {
      if (readOnly) return;
      state.tool = enabled ? "erase" : "paint";
      updateToolState();
      renderPalette();
      render();
    }

    function updateToolState() {
      const erasing = state.tool === "erase";
      eraserButton.setAttribute("aria-pressed", String(erasing));
      nameInput.disabled = erasing;
      pickColorButton.disabled = erasing;
      if (readOnly) {
        nameInput.disabled = true;
        pickColorButton.disabled = true;
        eraserButton.disabled = true;
        clearButton.disabled = true;
        exportMapButton.disabled = true;
        importMapButton.disabled = true;
        document.querySelector(".toolbar").setAttribute("aria-disabled", "true");
      }
      canvas.style.cursor = erasing ? "cell" : "crosshair";
      if (readOnly) canvas.style.cursor = "default";
    }

    function applyReadOnlyView() {
      if (!readOnly) return;
      document.body.classList.add("readonly-view");
      document.querySelector(".toolbar").setAttribute("aria-hidden", "true");
      document.querySelector(".status").setAttribute("aria-hidden", "true");
    }

    function renderPalette() {
      paletteEl.innerHTML = "";
      state.palette.forEach((item, index) => {
        const button = document.createElement("button");
        button.className = "swatch";
        button.type = "button";
        button.style.background = item.color;
        button.title = item.name;
        button.setAttribute("aria-label", item.name);
        button.setAttribute("aria-pressed", String(index === state.selected));
        button.disabled = readOnly;
        button.addEventListener("click", () => setSelected(index));
        paletteEl.appendChild(button);
      });
      const addButton = document.createElement("button");
      addButton.className = "swatch add-swatch";
      addButton.type = "button";
      addButton.title = "添加颜色";
      addButton.setAttribute("aria-label", "添加颜色");
      addButton.setAttribute("aria-pressed", "false");
      addButton.disabled = readOnly;
      addButton.innerHTML = `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>`;
      addButton.addEventListener("click", addColor);
      paletteEl.appendChild(addButton);
    }

    function paintAt(x, y) {
      if (readOnly) return;
      const triangle = locateTriangle(x, y);
      if (!triangle || triangle.key === state.lastPaintedKey) return;
      state.lastPaintedKey = triangle.key;
      if (state.tool === "erase") state.cells.delete(triangle.key);
      else state.cells.set(triangle.key, state.selected);
      saveState();
      render();
    }

    function updateStats() {
      const colored = state.cells.size;
      const hover = state.hoverId === null ? "-" : state.hoverId;
      metaEl.textContent = `${colored} 个地块已着色`;
      hoverInfo.textContent = `悬停: ${hover}`;
    }

    canvas.addEventListener("pointermove", (event) => {
      const rect = canvas.getBoundingClientRect();
      state.pointer.x = event.clientX - rect.left;
      state.pointer.y = event.clientY - rect.top;
      const triangle = locateTriangle(state.pointer.x, state.pointer.y);
      state.hoverId = triangle?.key ?? null;
      if (state.isPainting) paintAt(state.pointer.x, state.pointer.y);
      render();
    });

    canvas.addEventListener("pointerleave", () => {
      state.pointer.x = -9999;
      state.pointer.y = -9999;
      state.hoverId = null;
      state.isPainting = false;
      state.lastPaintedKey = null;
      render();
    });

    canvas.addEventListener("pointerdown", (event) => {
      if (readOnly) return;
      const rect = canvas.getBoundingClientRect();
      state.isPainting = true;
      state.lastPaintedKey = null;
      canvas.setPointerCapture(event.pointerId);
      paintAt(event.clientX - rect.left, event.clientY - rect.top);
    });

    canvas.addEventListener("pointerup", () => {
      state.isPainting = false;
      state.lastPaintedKey = null;
    });

    canvas.addEventListener("pointercancel", () => {
      state.isPainting = false;
      state.lastPaintedKey = null;
    });

    nameInput.addEventListener("input", () => {
      if (readOnly) return;
      state.palette[state.selected].name = nameInput.value.trim() || "未命名";
      saveState();
      renderPalette();
      render();
    });

    nativeColor.addEventListener("input", () => {
      if (readOnly) return;
      state.palette[state.selected].color = nativeColor.value;
      saveState();
      renderPalette();
      render();
    });

    pickColorButton.addEventListener("click", () => nativeColor.click());

    eraserButton.addEventListener("click", () => {
      setEraser(state.tool !== "erase");
    });

    clearButton.addEventListener("click", () => {
      if (readOnly) return;
      state.cells.clear();
      saveState();
      render();
    });

    exportMapButton.addEventListener("click", () => {
      if (readOnly) return;
      saveState();
      downloadMarkdown("map.md", "Map Data", currentMapData());
    });

    importMapButton.addEventListener("click", () => {
      if (readOnly) return;
      mapFileInput.click();
    });

    mapFileInput.addEventListener("change", async () => {
      if (readOnly || !mapFileInput.files[0]) return;
      const imported = parseMarkdownJson(await mapFileInput.files[0].text(), { palette: null, cells: {} });
      if (Array.isArray(imported.palette) && imported.palette.length) state.palette = imported.palette;
      state.cells = new Map(Object.entries(imported.cells || {}).map(([key, value]) => [key, Number(value)]));
      saveState();
      renderPalette();
      setSelected(0);
      resize();
      mapFileInput.value = "";
    });

    window.addEventListener("resize", resize);

    (async function init() {
      await loadState();
      applyReadOnlyView();
      renderPalette();
      setSelected(0);
      if (readOnly) updateToolState();
      resize();
      // Kick off entrance animation
      anim.running = true;
      anim.startTime = performance.now();
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
