<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天坑-卡厄兰法术库</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap');

    :root {
      --gold: #d4a843;
      --gold-dim: #a07838;
      --parchment: #e8d5a3;
      --muted: #8a6840;
      --border: #4a2e10;
      --panel-bg: rgba(22, 12, 4, 0.94);
      --energy: #c55d45;
      --space: #6888c8;
      --convert: #d4a843;
      --time: #6f9a50;
      --unknown: #7a7060;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      color: var(--parchment);
      font-family: "IM Fell English", "Microsoft YaHei", "Times New Roman", serif;
      background: #080502;
    }

    body {
      min-width: 320px;
      position: relative;
    }

    /* Torch-glow ambient background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 45% at 50% 0%, rgba(120,65,15,0.18), transparent 65%),
        radial-gradient(ellipse 40% 50% at 10% 60%, rgba(80,30,8,0.14), transparent 55%);
      animation: ambientFlicker 10s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes ambientFlicker {
      0%   { opacity: 0.6; }
      40%  { opacity: 1; }
      70%  { opacity: 0.75; }
      100% { opacity: 0.95; }
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      position: relative;
      z-index: 1;
    }

    /* ── TOP BAR ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 5, 1, 0.92);
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 20px rgba(0,0,0,0.6);
    }

    .brand {
      font-size: 18px;
      font-weight: normal;
      font-style: italic;
      color: var(--gold);
      white-space: nowrap;
      letter-spacing: 0.05em;
      text-shadow: 0 0 16px rgba(212,168,67,0.4);
    }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav button,
    .action,
    .tool {
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--muted);
      background: rgba(30, 15, 4, 0.8);
      transition: transform 180ms ease, border-color 180ms ease, color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .nav button { padding: 0 14px; }

    .nav button[aria-pressed="true"],
    .tool[aria-pressed="true"] {
      color: var(--gold);
      border-color: var(--gold-dim);
      background: rgba(60, 35, 8, 0.9);
      box-shadow: 0 0 10px rgba(212,168,67,0.2);
    }

    .nav button:hover,
    .action:hover,
    .tool:hover {
      transform: translateY(-1px);
      border-color: var(--gold-dim);
      color: var(--parchment);
    }

    .nav button[aria-pressed="true"]:hover,
    .tool[aria-pressed="true"]:hover {
      color: var(--gold);
      background: rgba(70, 40, 8, 0.95);
    }

    .library-count {
      color: var(--muted);
      font-size: 13px;
      font-style: italic;
      white-space: nowrap;
    }

    /* ── MAIN CONTENT ── */
    .main {
      width: min(1240px, 100%);
      margin: 0 auto;
      padding: 24px 18px 48px;
    }

    .view { display: none; }

    .view.active {
      display: grid;
      gap: 18px;
      animation: viewFadeIn 0.3s ease both;
    }

    @keyframes viewFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .readonly-mode [data-view="add"],
    .readonly-mode #searchAdd { display: none; }

    /* ── SEARCH ── */
    .search-panel { display: grid; gap: 14px; }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .search-input,
    .field,
    textarea,
    select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 0 12px;
      color: var(--parchment);
      background: rgba(16, 8, 2, 0.88);
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    textarea {
      min-height: 110px;
      padding: 10px 12px;
      resize: vertical;
      line-height: 1.6;
    }

    .search-input {
      min-height: 56px;
      padding: 0 18px;
      font-size: clamp(18px, 3.5vw, 32px);
      font-style: italic;
      letter-spacing: 0.02em;
    }

    .search-input::placeholder,
    .field::placeholder,
    textarea::placeholder { color: rgba(160,120,64,0.4); font-style: italic; }

    .search-input:focus,
    .field:focus,
    textarea:focus,
    select:focus {
      border-color: var(--gold-dim);
      box-shadow: 0 0 0 2px rgba(212,168,67,0.18), 0 0 12px rgba(212,168,67,0.1);
    }

    select option { background: #1a0e04; color: var(--parchment); }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-style: italic;
      letter-spacing: 0.04em;
    }

    /* ── ACTIONS ── */
    .action {
      padding: 0 16px;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      white-space: nowrap;
    }

    .action.primary {
      color: var(--gold);
      border-color: var(--gold-dim);
      background: rgba(50, 28, 6, 0.9);
      box-shadow: 0 0 12px rgba(212,168,67,0.12);
    }

    .action.primary:hover {
      background: rgba(70, 40, 8, 0.95);
      box-shadow: 0 0 18px rgba(212,168,67,0.25);
      border-color: var(--gold);
    }

    /* ── SPELL CARDS ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 14px;
    }

    .empty {
      min-height: 190px;
      display: grid;
      place-items: center;
      border: 1px dashed rgba(212,168,67,0.15);
      border-radius: 2px;
      color: var(--muted);
      font-style: italic;
      background: rgba(16,8,2,0.5);
    }

    .card {
      min-height: 200px;
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 14px;
      padding: 14px;
      border: 1px solid var(--border);
      border-top: 1px solid rgba(212,168,67,0.18);
      border-radius: 2px;
      text-align: left;
      color: var(--parchment);
      background: linear-gradient(150deg, rgba(28,15,5,0.95), rgba(18,9,2,0.98));
      box-shadow: 0 8px 28px rgba(0,0,0,0.5);
      transition: transform 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      animation: cardAppear 0.4s ease both;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 40%, rgba(212,168,67,0.03) 55%, transparent 70%);
      opacity: 0;
      transition: opacity 250ms ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(212,168,67,0.4);
      border-top-color: var(--gold-dim);
      box-shadow: 0 14px 40px rgba(0,0,0,0.65), 0 0 16px rgba(212,168,67,0.08);
    }

    .card:hover::before { opacity: 1; }

    /* ── RUNE BOX ── */
    .rune-box {
      min-width: 0;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: rgba(10,5,1,0.8);
      transition: border-color 200ms ease, box-shadow 200ms ease;
    }

    .card:hover .rune-box {
      border-color: rgba(212,168,67,0.3);
      box-shadow: inset 0 0 12px rgba(212,168,67,0.06);
    }

    .card-body {
      min-width: 0;
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .name-line {
      display: flex;
      gap: 8px;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .spell-name {
      margin: 0;
      font-size: 20px;
      font-weight: normal;
      font-style: italic;
      line-height: 1.1;
      color: var(--parchment);
      letter-spacing: 0.02em;
    }

    .badges {
      display: inline-flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      min-height: 22px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 7px;
      border: 1px solid rgba(212,168,67,0.2);
      border-radius: 2px;
      color: var(--muted);
      background: rgba(10,5,1,0.6);
      font-size: 11px;
      white-space: nowrap;
    }

    .category-symbol {
      font-size: 13px;
      font-weight: bold;
    }

    .line {
      margin: 0;
      color: rgba(232,213,163,0.62);
      line-height: 1.5;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      font-size: 13px;
    }

    .incantation {
      -webkit-line-clamp: 2;
      font-style: italic;
      color: rgba(232,213,163,0.8);
    }

    .fit {
      -webkit-line-clamp: 1;
      font-family: Consolas, "Cascadia Mono", monospace;
      color: rgba(100,180,140,0.85);
      font-style: normal;
      font-size: 12px;
    }

    .effect {
      -webkit-line-clamp: 3;
    }

    /* ── ADD FORM ── */
    .form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 430px);
      gap: 18px;
      align-items: start;
    }

    .panel {
      display: grid;
      gap: 14px;
      padding: 18px;
      border: 1px solid var(--border);
      border-top: 2px solid rgba(212,168,67,0.25);
      border-radius: 2px;
      background: linear-gradient(170deg, rgba(24,13,4,0.96), rgba(15,7,2,0.98));
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      position: relative;
    }

    .panel::before,
    .panel::after {
      content: "✦";
      position: absolute;
      top: 8px;
      font-size: 8px;
      color: var(--gold);
      opacity: 0.4;
    }
    .panel::before { left: 10px; }
    .panel::after  { right: 10px; }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .wide { grid-column: 1 / -1; }

    /* ── RUNE EDITOR ── */
    .rune-editor { gap: 12px; }

    .tools-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      padding: 0;
      font-size: 15px;
    }

    .line-tool {
      width: auto;
      min-width: 52px;
      padding: 0 10px;
      font-size: 12px;
      font-style: italic;
    }

    .rune-edit-area {
      display: grid;
      place-items: center;
      min-height: 360px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: rgba(8,4,1,0.88);
      position: relative;
      overflow: hidden;
    }

    /* Faint rune-grid glow */
    .rune-edit-area::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(212,168,67,0.05), transparent 65%);
      pointer-events: none;
    }

    .rune-svg {
      width: min(340px, 100%);
      aspect-ratio: 1;
      overflow: visible;
      position: relative;
      z-index: 1;
    }

    @keyframes runeLineDraw {
      from { stroke-dashoffset: 300; opacity: 0; }
      to   { stroke-dashoffset: 0; opacity: 1; }
    }

    .rune-fresh-point {
      animation: runePointPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .rune-fresh-line {
      animation: runeLineFresh 0.35s ease both;
    }

    @keyframes runeLineFresh {
      from { opacity: 0; filter: drop-shadow(0 0 0 rgba(212,168,67,0)); }
      45%  { opacity: 1; filter: drop-shadow(0 0 8px rgba(212,168,67,0.45)); }
      to   { opacity: 1; filter: drop-shadow(0 0 0 rgba(212,168,67,0)); }
    }

    @keyframes runePointPop {
      from { transform: scale(0); transform-origin: center; opacity: 0; }
      to   { transform: scale(1); transform-origin: center; opacity: 1; }
    }

    .point-hit {
      cursor: pointer;
      fill: transparent;
      transition: fill 150ms ease;
    }

    .point-hit:hover {
      fill: rgba(212,168,67,0.1);
    }

    .point-anchor {
      fill: rgba(212,168,67,0.2);
    }

    /* Override SVG colors for dark theme */
    .rune-svg line[stroke="#17202a"],
    .rune-svg path[stroke="#17202a"] {
      stroke: #c8943a !important;
    }

    .rune-svg circle[fill="#17202a"] {
      fill: #c8943a !important;
    }

    .rune-svg circle[stroke="#17202a"] {
      stroke: #c8943a !important;
      fill: rgba(8,4,1,0.8) !important;
    }

    .rune-svg polygon[stroke="#17202a"] {
      stroke: #c8943a !important;
      fill: rgba(8,4,1,0.8) !important;
    }

    .rune-svg rect[stroke="#17202a"] {
      stroke: #c8943a !important;
      fill: rgba(8,4,1,0.8) !important;
    }

    .rune-svg circle[stroke="#0f766e"] {
      stroke: var(--gold) !important;
    }

    /* ── DETAIL MODAL ── */
    .detail-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 22px;
      background: rgba(4,2,0,0.72);
      backdrop-filter: blur(10px);
    }

    .detail-backdrop.open {
      display: grid;
      animation: backdropIn 0.25s ease both;
    }

    @keyframes backdropIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .detail {
      width: min(920px, 100%);
      max-height: calc(100vh - 44px);
      overflow: auto;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      padding: 20px;
      border: 1px solid var(--border);
      border-top: 2px solid var(--gold-dim);
      border-radius: 2px;
      background: linear-gradient(170deg, rgba(26,14,4,0.98), rgba(16,8,2,0.99));
      box-shadow: 0 30px 80px rgba(0,0,0,0.85), 0 0 40px rgba(212,168,67,0.06);
      animation: detailSlideIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes detailSlideIn {
      from { opacity: 0; transform: scale(0.96) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .detail .rune-box {
      border: 1px solid var(--border);
      border-radius: 2px;
      background: rgba(8,4,1,0.9);
      box-shadow: inset 0 0 24px rgba(212,168,67,0.05);
    }

    .detail-text {
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .detail-text h2 {
      margin: 0;
      font-size: 30px;
      font-weight: normal;
      font-style: italic;
      color: var(--gold);
      letter-spacing: 0.03em;
      text-shadow: 0 0 20px rgba(212,168,67,0.3);
    }

    .detail-section {
      display: grid;
      gap: 5px;
      padding-top: 10px;
      border-top: 1px solid rgba(212,168,67,0.08);
    }

    .detail-section strong {
      font-size: 11px;
      color: var(--muted);
      font-style: italic;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .detail-section p {
      margin: 0;
      line-height: 1.7;
      white-space: pre-wrap;
      color: rgba(232,213,163,0.8);
      font-size: 14px;
    }

    .detail-actions {
      display: flex;
      justify-content: end;
    }

    .icon {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* ── TOAST NOTIFICATION ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      z-index: 100;
      padding: 10px 20px;
      border: 1px solid var(--gold-dim);
      border-radius: 2px;
      background: rgba(30,16,4,0.96);
      color: var(--gold);
      font-style: italic;
      font-size: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.6), 0 0 12px rgba(212,168,67,0.15);
      animation: toastIn 0.35s cubic-bezier(0.22,1,0.36,1) both;
      pointer-events: none;
    }

    .toast.out {
      animation: toastOut 0.3s ease both;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(16px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateX(-50%) translateY(0); }
      to   { opacity: 0; transform: translateX(-50%) translateY(-8px); }
    }

    @media (max-width: 880px) {
      .topbar { grid-template-columns: 1fr; }
      .form-grid, .detail { grid-template-columns: 1fr; }
      .fields { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .card { grid-template-columns: 100px 1fr; }
      .spell-name { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">法术库</div>
      <nav class="nav" aria-label="法术库视图">
        <button type="button" data-view="search" aria-pressed="true">搜索</button>
        <button type="button" data-view="add" aria-pressed="false">添加法术</button>
        <button type="button" data-view="list" aria-pressed="false">查看法术</button>
      </nav>
      <div class="library-count" id="libraryCount">0 个法术</div>
    </header>

    <section class="main">
      <section class="view active" id="searchView">
        <div class="search-panel">
          <div class="search-row">
            <input class="search-input" id="searchInput" type="search" autocomplete="off" placeholder="搜索法术">
            <button class="action primary" type="button" id="searchAdd">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
              添加
            </button>
          </div>
          <div class="cards" id="searchResults"></div>
        </div>
      </section>

      <section class="view" id="addView">
        <form class="form-grid" id="spellForm">
          <section class="panel fields">
            <label class="wide">名字
              <input class="field" id="spellName" maxlength="36" autocomplete="off" placeholder="法术名称">
            </label>
            <label>分类
              <select id="spellCategory"></select>
            </label>
            <label>等级
              <select id="spellLevel">
                <option value="下">下</option>
                <option value="中">中</option>
                <option value="上">上</option>
                <option value="超级">超级</option>
              </select>
            </label>
            <label class="wide">法术咒文
              <textarea id="spellIncantation"></textarea>
            </label>
            <label class="wide">拟合效果
              <input class="field" id="spellFit" autocomplete="off" placeholder="f(x)=">
            </label>
            <label class="wide">效果
              <textarea id="spellEffect"></textarea>
            </label>
            <div class="wide tools-row">
              <button class="action primary" type="submit">存入法术</button>
              <button class="action" type="button" id="resetForm">清空表单</button>
              <button class="action" type="button" id="importData">导入Markdown</button>
              <button class="action" type="button" id="exportData">导出Markdown</button>
              <input id="spellFile" type="file" accept=".md" hidden>
            </div>
          </section>

          <section class="panel rune-editor">
            <div class="tools-row" id="pointTools"></div>
            <div class="tools-row" id="lineTools"></div>
            <div class="rune-edit-area" id="runeEditor"></div>
          </section>
        </form>
      </section>

      <section class="view" id="listView">
        <div class="cards" id="spellCards"></div>
      </section>
    </section>
  </main>

  <section class="detail-backdrop" id="detailBackdrop" aria-hidden="true">
    <article class="detail" id="detailPanel"></article>
  </section>

  <script>
    const categories = {
      energy: { symbol: "△", label: "能量法术", color: "var(--energy)" },
      space: { symbol: "□", label: "空间法术", color: "var(--space)" },
      convert: { symbol: "→", label: "转换法术", color: "var(--convert)" },
      time: { symbol: "○", label: "时间法术", color: "var(--time)" },
      unknown: { symbol: "?", label: "未知", color: "var(--unknown)" }
    };

    const pointTypes = {
      none: { label: "不选择", icon: "" },
      solidCircle: { label: "实心圆点", icon: "●" },
      hollowCircle: { label: "空心圆点", icon: "○" },
      hollowTriangle: { label: "空心三角形点", icon: "△" },
      hollowSquare: { label: "空心正方形点", icon: "□" }
    };

    const lineTypes = {
      none: "不连线",
      solid: "实线",
      dashed: "虚线",
      wave: "波浪线"
    };

    const pointLayout = [
      ["topOuter", 160, 36],
      ["p1", 86, 86],
      ["p2", 160, 86],
      ["p3", 234, 86],
      ["leftOuter", 36, 160],
      ["p4", 86, 160],
      ["p5", 160, 160],
      ["p6", 234, 160],
      ["rightOuter", 284, 160],
      ["p7", 86, 234],
      ["p8", 160, 234],
      ["p9", 234, 234],
      ["bottomOuter", 160, 284]
    ].map(([id, x, y]) => ({ id, x, y }));

    const markdownPath = "../data/spells.md";
    const localDraftKey = "caerland-spells-draft-v2";
    const readOnly = new URLSearchParams(window.location.search).get("readonly") === "1";
    const state = {
      spells: [],
      view: "search",
      editMode: "point",
      pointTool: "solidCircle",
      lineTool: "solid",
      lineStart: null,
      lastPoint: null,
      lastLine: null,
      draftRune: blankRune()
    };

    const el = {
      nav: document.querySelectorAll(".nav button"),
      libraryCount: document.querySelector("#libraryCount"),
      searchInput: document.querySelector("#searchInput"),
      searchResults: document.querySelector("#searchResults"),
      searchAdd: document.querySelector("#searchAdd"),
      spellCards: document.querySelector("#spellCards"),
      spellForm: document.querySelector("#spellForm"),
      spellName: document.querySelector("#spellName"),
      spellCategory: document.querySelector("#spellCategory"),
      spellLevel: document.querySelector("#spellLevel"),
      spellIncantation: document.querySelector("#spellIncantation"),
      spellFit: document.querySelector("#spellFit"),
      spellEffect: document.querySelector("#spellEffect"),
      pointTools: document.querySelector("#pointTools"),
      lineTools: document.querySelector("#lineTools"),
      runeEditor: document.querySelector("#runeEditor"),
      resetForm: document.querySelector("#resetForm"),
      importData: document.querySelector("#importData"),
      exportData: document.querySelector("#exportData"),
      spellFile: document.querySelector("#spellFile"),
      detailBackdrop: document.querySelector("#detailBackdrop"),
      detailPanel: document.querySelector("#detailPanel")
    };

    function blankRune() {
      return { points: {}, lines: {} };
    }

    async function loadSpells() {
      try {
        const draft = !readOnly ? localStorage.getItem(localDraftKey) : null;
        const saved = draft ? JSON.parse(draft) : await fetchMarkdownJson(markdownPath, []);
        state.spells = Array.isArray(saved) ? saved : [];
      } catch (error) {
        console.error(error);
        state.spells = [];
      }
    }

    function saveSpells() {
      if (readOnly) return;
      localStorage.setItem(localDraftKey, JSON.stringify(state.spells));
      updateCount();
    }

    async function fetchMarkdownJson(url, fallback) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`无法读取 ${url}`);
      return parseMarkdownJson(await response.text(), fallback);
    }

    function parseMarkdownJson(markdown, fallback) {
      const match = markdown.match(/```json\s*([\s\S]*?)\s*```/i);
      if (!match) return fallback;
      return JSON.parse(match[1]);
    }

    function markdownFor(title, data) {
      return `# ${title}\n\nStatic data for GitHub Pages.\n\n\`\`\`json\n${JSON.stringify(data, null, 2)}\n\`\`\`\n`;
    }

    function downloadMarkdown(fileName, title, data) {
      const blob = new Blob([markdownFor(title, data)], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      link.click();
      URL.revokeObjectURL(url);
    }

    function updateCount() {
      el.libraryCount.textContent = `${state.spells.length} 个法术`;
    }

    function setupCategoryOptions() {
      el.spellCategory.innerHTML = Object.entries(categories)
        .map(([value, item]) => `<option value="${value}">${item.symbol} ${item.label}</option>`)
        .join("");
    }

    function setupTools() {
      el.pointTools.innerHTML = Object.entries(pointTypes).map(([type, item]) => {
        return `<button class="tool" type="button" data-point-tool="${type}" title="${item.label}" aria-pressed="${state.editMode === "point" && type === state.pointTool}">${item.icon || "×"}</button>`;
      }).join("");

      el.lineTools.innerHTML = Object.entries(lineTypes).map(([type, label]) => {
        return `<button class="tool line-tool" type="button" data-line-tool="${type}" aria-pressed="${state.editMode === "line" && type === state.lineTool}">${label}</button>`;
      }).join("");
    }

    function bindEvents() {
      el.nav.forEach((button) => {
        button.addEventListener("click", () => setView(button.dataset.view));
      });

      el.searchInput.addEventListener("input", renderSearch);
      el.searchAdd.addEventListener("click", () => {
        if (!readOnly) setView("add");
      });

      el.pointTools.addEventListener("click", (event) => {
        const button = event.target.closest("[data-point-tool]");
        if (!button) return;
        state.editMode = "point";
        state.pointTool = button.dataset.pointTool;
        state.lineStart = null;
        state.lastPoint = null;
        state.lastLine = null;
        setupTools();
        renderRuneEditor();
      });

      el.lineTools.addEventListener("click", (event) => {
        const button = event.target.closest("[data-line-tool]");
        if (!button) return;
        state.editMode = "line";
        state.lineTool = button.dataset.lineTool;
        state.lineStart = null;
        state.lastPoint = null;
        state.lastLine = null;
        setupTools();
        renderRuneEditor();
      });

      el.spellForm.addEventListener("submit", (event) => {
        event.preventDefault();
        addSpell();
      });

      el.resetForm.addEventListener("click", resetForm);
      el.importData.addEventListener("click", () => {
        if (!readOnly) el.spellFile.click();
      });
      el.spellFile.addEventListener("change", importSpells);
      el.exportData.addEventListener("click", exportSpells);

      el.detailBackdrop.addEventListener("click", (event) => {
        if (event.target === el.detailBackdrop || event.target.closest("[data-close-detail]")) closeDetail();
      });
    }

    function setView(view) {
      if (readOnly && view === "add") view = "search";
      state.view = view;
      document.querySelectorAll(".view").forEach((section) => section.classList.remove("active"));
      document.querySelector(`#${view}View`).classList.add("active");
      el.nav.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.view === view)));
      if (view === "search") renderSearch();
      if (view === "list") renderList();
      if (view === "add") {
        setupTools();
        renderRuneEditor();
      }
    }

    function renderSearch() {
      const query = normalize(el.searchInput.value);
      const results = state.spells.filter((spell) => {
        const haystack = normalize([spell.name, spell.effect, spell.incantation, spell.fit, categories[spell.category]?.label, spell.level].join(" "));
        return !query || haystack.includes(query);
      });
      renderCards(el.searchResults, results);
    }

    function renderList() {
      renderCards(el.spellCards, state.spells);
    }

    function renderCards(target, spells) {
      if (!spells.length) {
        target.innerHTML = `<div class="empty">暂无法术</div>`;
        return;
      }
      target.innerHTML = spells.map(cardHtml).join("");
      target.querySelectorAll("[data-spell-id]").forEach((card) => {
        card.addEventListener("click", () => openDetail(card.dataset.spellId));
      });
    }

    function cardHtml(spell) {
      const category = categories[spell.category] || categories.unknown;
      return `
        <button class="card" type="button" data-spell-id="${spell.id}">
          <div class="rune-box">${runeSvg(spell.rune, 124)}</div>
          <div class="card-body">
            <div class="name-line">
              <h2 class="spell-name">${escapeHtml(spell.name || "未命名")}</h2>
              <span class="badges">
                <span class="badge"><span class="category-symbol" style="color:${category.color}">${category.symbol}</span>${category.label}</span>
                <span class="badge">${escapeHtml(spell.level || "下")}</span>
              </span>
            </div>
            <p class="line incantation">${escapeHtml(spell.incantation || "无咒文")}</p>
            <p class="line fit">${escapeHtml(spell.fit || "无拟合表达式")}</p>
            <p class="line effect">${truncate(spell.effect || "无效果记录", 108)}</p>
          </div>
        </button>
      `;
    }

    async function addSpell() {
      if (readOnly) return;
      const spell = {
        id: `spell-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        name: el.spellName.value.trim() || "未命名法术",
        category: el.spellCategory.value,
        level: el.spellLevel.value,
        effect: el.spellEffect.value.trim(),
        fit: el.spellFit.value.trim(),
        incantation: el.spellIncantation.value.trim(),
        rune: cloneRune(state.draftRune)
      };
      state.spells.unshift(spell);
      saveSpells();
      resetForm();
      showToast(`「${spell.name}」已存入法术库`);
      setView("list");
    }

    function showToast(message) {
      const existing = document.querySelector(".toast");
      if (existing) existing.remove();
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.classList.add("out");
        toast.addEventListener("animationend", () => toast.remove(), { once: true });
      }, 2200);
    }

    function resetForm() {
      el.spellForm.reset();
      state.draftRune = blankRune();
      state.lineStart = null;
      state.lastPoint = null;
      state.lastLine = null;
      state.editMode = "point";
      state.pointTool = "solidCircle";
      state.lineTool = "solid";
      setupTools();
      renderRuneEditor();
    }

    function cloneRune(rune) {
      return {
        points: { ...(rune?.points || {}) },
        lines: { ...(rune?.lines || {}) }
      };
    }

    function renderRuneEditor() {
      const svg = runeSvg(state.draftRune, 330, true);
      el.runeEditor.innerHTML = svg;
      el.runeEditor.querySelectorAll("[data-point-id]").forEach((point) => {
        point.addEventListener("click", () => editPoint(point.dataset.pointId));
      });
      state.lastPoint = null;
      state.lastLine = null;
    }

    function editPoint(pointId) {
      if (state.editMode === "line" && state.lineStart) {
        if (state.lineStart !== pointId) {
          setLine(state.lineStart, pointId, state.lineTool);
          const key = lineKey(state.lineStart, pointId);
          state.lastLine = state.lineTool === "none" ? null : key;
          state.lastPoint = null;
        }
        state.lineStart = null;
      } else if (state.editMode === "line") {
        state.lineStart = pointId;
        state.lastPoint = null;
        state.lastLine = null;
      } else {
        if (state.pointTool === "none") {
          delete state.draftRune.points[pointId];
          state.lastPoint = null;
        } else {
          state.draftRune.points[pointId] = state.pointTool;
          state.lastPoint = pointId;
        }
        state.lastLine = null;
      }
      renderRuneEditor();
    }

    function setLine(a, b, type) {
      const key = lineKey(a, b);
      if (type === "none") delete state.draftRune.lines[key];
      else state.draftRune.lines[key] = type;
    }

    function lineKey(a, b) {
      return [a, b].sort().join("|");
    }

    function runeSvg(rune = blankRune(), size = 180, editable = false) {
      const points = rune.points || {};
      const lines = rune.lines || {};
      const lineColor = "#c8943a";
      const lineMarkup = Object.entries(lines).map(([key, type]) => {
        const [a, b] = key.split("|");
        const pa = pointLayout.find((point) => point.id === a);
        const pb = pointLayout.find((point) => point.id === b);
        if (!pa || !pb || type === "none") return "";
        const len = Math.hypot(pb.x - pa.x, pb.y - pa.y);
        const freshClass = editable && state.lastLine === key ? "rune-fresh-line" : "";
        if (type === "wave") return wavePath(pa, pb, lineColor, len, freshClass);
        const dash = type === "dashed" ? `stroke-dasharray="10 7"` : "";
        return `<line class="${freshClass}" x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="${lineColor}" stroke-width="2.5" stroke-linecap="round" ${dash}></line>`;
      }).join("");

      const pointMarkup = pointLayout.map((point) => {
        const active = points[point.id] || "none";
        const mark = pointMark(point, active, lineColor, editable && state.lastPoint === point.id);
        const selected = editable && state.lineStart === point.id
          ? `<circle cx="${point.x}" cy="${point.y}" r="18" fill="none" stroke="${lineColor}" stroke-width="2" opacity="0.8"></circle>`
          : "";
        const hit = editable ? `<circle class="point-hit" data-point-id="${point.id}" cx="${point.x}" cy="${point.y}" r="19"></circle>` : "";
        return `<g>${selected}<circle class="point-anchor" cx="${point.x}" cy="${point.y}" r="3" fill="rgba(212,168,67,0.2)"></circle>${mark}${hit}</g>`;
      }).join("");

      return `<svg class="rune-svg" width="${size}" height="${size}" viewBox="0 0 320 320" aria-hidden="true">
        <rect x="86" y="86" width="148" height="148" fill="none" stroke="rgba(212,168,67,0.1)" stroke-width="1"></rect>
        <line x1="160" y1="36" x2="160" y2="284" stroke="rgba(212,168,67,0.07)" stroke-width="1"></line>
        <line x1="36" y1="160" x2="284" y2="160" stroke="rgba(212,168,67,0.07)" stroke-width="1"></line>
        ${lineMarkup}
        ${pointMarkup}
      </svg>`;
    }

    function pointMark(point, type, color = "#c8943a", fresh = false) {
      const bg = "rgba(8,4,1,0.85)";
      const freshClass = fresh ? ' class="rune-fresh-point"' : "";
      if (type === "solidCircle") return `<circle${freshClass} cx="${point.x}" cy="${point.y}" r="8" fill="${color}"></circle>`;
      if (type === "hollowCircle") return `<circle${freshClass} cx="${point.x}" cy="${point.y}" r="9" fill="${bg}" stroke="${color}" stroke-width="2.5"></circle>`;
      if (type === "hollowTriangle") {
        const p = `${point.x},${point.y - 11} ${point.x - 10},${point.y + 8} ${point.x + 10},${point.y + 8}`;
        return `<polygon${freshClass} points="${p}" fill="${bg}" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"></polygon>`;
      }
      if (type === "hollowSquare") return `<rect${freshClass} x="${point.x - 9}" y="${point.y - 9}" width="18" height="18" fill="${bg}" stroke="${color}" stroke-width="2.5"></rect>`;
      return "";
    }

    function wavePath(a, b, color = "#c8943a", len = 100, freshClass = "") {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const pathLen = Math.hypot(dx, dy) || 1;
      const nx = -dy / pathLen;
      const ny = dx / pathLen;
      const steps = Math.max(8, Math.round(pathLen / 18));
      let d = `M ${a.x} ${a.y}`;
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const amp = Math.sin(t * Math.PI * steps) * 7;
        d += ` L ${a.x + dx * t + nx * amp} ${a.y + dy * t + ny * amp}`;
      }
      return `<path class="${freshClass}" d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round"></path>`;
    }

    function openDetail(id) {
      const spell = state.spells.find((item) => item.id === id);
      if (!spell) return;
      const category = categories[spell.category] || categories.unknown;
      el.detailPanel.innerHTML = `
        <div class="rune-box">${runeSvg(spell.rune, 260)}</div>
        <div class="detail-text">
          <div class="detail-actions"><button class="action" type="button" data-close-detail>关闭</button></div>
          <h2>${escapeHtml(spell.name || "未命名")}</h2>
          <div class="badges">
            <span class="badge"><span class="category-symbol" style="color:${category.color}">${category.symbol}</span>${category.label}</span>
            <span class="badge">${escapeHtml(spell.level || "下")}</span>
          </div>
          <div class="detail-section"><strong>法术咒文</strong><p>${escapeHtml(spell.incantation || "无咒文")}</p></div>
          <div class="detail-section"><strong>拟合效果</strong><p>${escapeHtml(spell.fit || "无拟合表达式")}</p></div>
          <div class="detail-section"><strong>效果</strong><p>${escapeHtml(spell.effect || "无效果记录")}</p></div>
        </div>
      `;
      el.detailBackdrop.classList.add("open");
      el.detailBackdrop.setAttribute("aria-hidden", "false");
    }

    function closeDetail() {
      el.detailBackdrop.classList.remove("open");
      el.detailBackdrop.setAttribute("aria-hidden", "true");
    }

    async function exportSpells() {
      if (readOnly) return;
      saveSpells();
      downloadMarkdown("spells.md", "Spell Data", state.spells);
    }

    async function importSpells() {
      if (readOnly || !el.spellFile.files[0]) return;
      const imported = parseMarkdownJson(await el.spellFile.files[0].text(), []);
      state.spells = Array.isArray(imported) ? imported : [];
      saveSpells();
      renderSearch();
      renderList();
      el.spellFile.value = "";
      setView("list");
    }

    function normalize(value) {
      return String(value || "").trim().toLowerCase();
    }

    function truncate(value, length) {
      const text = String(value || "");
      return escapeHtml(text.length > length ? `${text.slice(0, length)}....` : text);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    (async function init() {
      if (readOnly) document.body.classList.add("readonly-mode");
      await loadSpells();
      setupCategoryOptions();
      setupTools();
      bindEvents();
      updateCount();
      renderRuneEditor();
      renderSearch();
    })();
  </script>
</body>
</html>
