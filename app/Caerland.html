<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天坑-卡厄兰入口</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      color: #18222b;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      background:
        linear-gradient(140deg, rgba(244, 247, 248, 0.96), rgba(226, 234, 231, 0.96)),
        radial-gradient(circle at 20% 18%, rgba(15, 118, 110, 0.12), transparent 34%),
        radial-gradient(circle at 78% 12%, rgba(188, 97, 73, 0.12), transparent 32%);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .window {
      width: min(980px, 100%);
      min-height: 520px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 24px 60px rgba(35, 45, 52, 0.18);
      backdrop-filter: blur(18px);
    }

    .titlebar {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid rgba(24, 34, 43, 0.1);
      background: rgba(255, 255, 255, 0.62);
    }

    .title {
      font-size: 15px;
      font-weight: 760;
    }

    .dots {
      display: flex;
      gap: 7px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #cfd8dc;
    }

    .dot:nth-child(1) {
      background: #bc6149;
    }

    .dot:nth-child(2) {
      background: #d39a23;
    }

    .dot:nth-child(3) {
      background: #0f766e;
    }

    .content {
      display: grid;
      align-content: center;
      gap: 22px;
      padding: clamp(28px, 6vw, 58px);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 76px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    p {
      max-width: 650px;
      margin: 0;
      color: rgba(24, 34, 43, 0.68);
      font-size: 15px;
      line-height: 1.7;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 8px;
    }

    .card {
      min-height: 180px;
      display: grid;
      align-content: space-between;
      gap: 16px;
      padding: 18px;
      border: 1px solid rgba(24, 34, 43, 0.12);
      border-radius: 8px;
      color: #18222b;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 14px 32px rgba(35, 45, 52, 0.12);
      transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(24, 34, 43, 0.24);
      box-shadow: 0 18px 38px rgba(35, 45, 52, 0.16);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-title {
      margin: 0;
      font-size: 24px;
      font-weight: 820;
      letter-spacing: 0;
    }

    .card-copy {
      margin: 0;
      font-size: 13px;
      line-height: 1.65;
      color: rgba(24, 34, 43, 0.68);
    }

    .icon-wrap {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: #17202a;
    }

    .icon {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .footer {
      padding: 12px 14px;
      border-top: 1px solid rgba(24, 34, 43, 0.1);
      color: rgba(24, 34, 43, 0.58);
      font-size: 12px;
      background: rgba(255, 255, 255, 0.54);
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <section class="window" aria-label="卡厄兰入口">
    <div class="titlebar">
      <div class="title">天坑-卡厄兰</div>
      <div class="dots" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <div class="content">
      <h1>天坑-卡厄兰</h1>
      <p>从这里进入的是只读浏览入口。地图、字典和法术库都不会修改本地 Markdown 数据。</p>

      <div class="cards">
        <a class="card" href="./map.html?readonly=1">
          <div class="card-top">
            <h2 class="card-title">地图</h2>
            <span class="icon-wrap">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"></path>
                <path d="M9 3v15"></path>
                <path d="M15 6v15"></path>
              </svg>
            </span>
          </div>
          <p class="card-copy">查看已保存的三角地块、颜色区域和区域名称。</p>
        </a>

        <a class="card" href="./language_dictionary%20.html?readonly=1">
          <div class="card-top">
            <h2 class="card-title">字典</h2>
            <span class="icon-wrap">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 19.5V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-1.5Z"></path>
                <path d="M8 7h8"></path>
                <path d="M8 11h6"></path>
              </svg>
            </span>
          </div>
          <p class="card-copy">搜索和浏览已存入的语言词典，不显示添加、导入、保存和删除入口。</p>
        </a>

        <a class="card" href="./spells.html?readonly=1">
          <div class="card-top">
            <h2 class="card-title">法术库</h2>
            <span class="icon-wrap">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2l2.4 6.8L21 11l-6.6 2.2L12 21l-2.4-7.8L3 11l6.6-2.2L12 2Z"></path>
              </svg>
            </span>
          </div>
          <p class="card-copy">搜索、查看法术卡片和详情，不显示新增或写入 Markdown 的入口。</p>
        </a>
      </div>
    </div>

    <div class="footer">只读入口</div>
  </section>
</body>
</html>
