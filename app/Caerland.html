<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天坑-卡厄兰入口</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap');

    :root {
      --gold: #d4a843;
      --gold-dim: #a07838;
      --parchment: #e8d5a3;
      --ink: #2c1a0e;
      --panel-bg: rgba(22, 12, 4, 0.92);
      --border: #5c3a1a;
      --border-gold: rgba(212, 168, 67, 0.28);
      --muted: #8a6840;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: "IM Fell English", "Microsoft YaHei", "Times New Roman", serif;
      color: var(--parchment);
      background: #080502;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      /* Subtle animated ember particles via pseudo-element on body */
      position: relative;
      overflow: hidden;
    }

    /* Animated background: slow drifting radial light like a torch glow */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 50%, rgba(140, 80, 20, 0.13), transparent 70%),
        radial-gradient(ellipse 80% 60% at 20% 80%, rgba(80, 30, 8, 0.18), transparent 60%),
        radial-gradient(ellipse 70% 55% at 80% 20%, rgba(60, 20, 5, 0.15), transparent 60%);
      animation: torchFlicker 8s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes torchFlicker {
      0%   { opacity: 0.7; transform: scale(1); }
      30%  { opacity: 1; transform: scale(1.02) translateY(-4px); }
      60%  { opacity: 0.85; transform: scale(0.99) translateY(2px); }
      100% { opacity: 1; transform: scale(1.03) translateY(-2px); }
    }

    /* Scattered rune-like background texture */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(212,168,67,0.03) 1px, transparent 1px),
        radial-gradient(circle, rgba(212,168,67,0.025) 1px, transparent 1px);
      background-size: 48px 48px, 72px 72px;
      background-position: 0 0, 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    .window {
      position: relative;
      z-index: 1;
      width: min(980px, 100%);
      min-height: 520px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      border: 1px solid var(--border);
      border-top: 2px solid var(--gold);
      border-radius: 2px;
      background: linear-gradient(170deg, rgba(28, 16, 5, 0.97), rgba(18, 9, 2, 0.99));
      box-shadow:
        0 0 0 1px rgba(212, 168, 67, 0.1),
        0 30px 80px rgba(0, 0, 0, 0.85),
        0 0 60px rgba(140, 80, 20, 0.12);
    }

    /* Gold corner ornaments */
    .window::before,
    .window::after {
      content: "⬡";
      position: absolute;
      top: 10px;
      font-size: 10px;
      color: var(--gold);
      opacity: 0.45;
      z-index: 2;
      pointer-events: none;
    }
    .window::before { left: 14px; }
    .window::after  { right: 14px; }

    .titlebar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(12, 6, 1, 0.7);
    }

    .title {
      font-size: 14px;
      font-weight: normal;
      font-style: italic;
      color: var(--gold-dim);
      letter-spacing: 0.06em;
    }

    .dots {
      display: flex;
      gap: 7px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #3a2010;
      border: 1px solid rgba(212,168,67,0.2);
    }

    .dot:nth-child(1) { background: #7a2010; box-shadow: 0 0 5px rgba(188,97,73,0.4); }
    .dot:nth-child(2) { background: #7a5a10; box-shadow: 0 0 5px rgba(211,154,35,0.4); }
    .dot:nth-child(3) { background: #0d5548; box-shadow: 0 0 5px rgba(15,118,110,0.4); }

    .content {
      display: grid;
      align-content: center;
      gap: 24px;
      padding: clamp(28px, 6vw, 58px);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 68px);
      line-height: 1.0;
      font-weight: normal;
      color: var(--gold);
      text-shadow:
        0 0 30px rgba(212, 168, 67, 0.4),
        0 0 60px rgba(212, 168, 67, 0.15),
        0 3px 6px rgba(0,0,0,0.9);
      animation: titlePulse 6s ease-in-out infinite alternate;
    }

    @keyframes titlePulse {
      0%   { text-shadow: 0 0 20px rgba(212,168,67,0.35), 0 3px 6px rgba(0,0,0,0.9); }
      100% { text-shadow: 0 0 40px rgba(212,168,67,0.55), 0 0 80px rgba(212,168,67,0.18), 0 3px 6px rgba(0,0,0,0.9); }
    }

    /* Decorative divider after h1 */
    h1::after {
      content: "";
      display: block;
      margin-top: 12px;
      height: 1px;
      width: min(340px, 80%);
      background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
      opacity: 0.5;
    }

    p {
      max-width: 650px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
      line-height: 1.75;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 6px;
    }

    .card {
      min-height: 176px;
      display: grid;
      align-content: space-between;
      gap: 14px;
      padding: 18px;
      border: 1px solid var(--border);
      border-top: 1px solid rgba(212, 168, 67, 0.18);
      border-radius: 2px;
      color: var(--parchment);
      text-decoration: none;
      background: linear-gradient(160deg, rgba(32, 18, 6, 0.9), rgba(20, 10, 3, 0.95));
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease, background 200ms ease;
      position: relative;
      overflow: hidden;
    }

    /* Card shimmer effect on hover */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(212, 168, 67, 0.04) 50%, transparent 70%);
      opacity: 0;
      transition: opacity 300ms ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(212, 168, 67, 0.45);
      border-top-color: var(--gold);
      box-shadow:
        0 16px 40px rgba(0,0,0,0.7),
        0 0 20px rgba(212, 168, 67, 0.1);
      background: linear-gradient(160deg, rgba(45, 26, 8, 0.95), rgba(28, 14, 4, 0.98));
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-title {
      margin: 0;
      font-size: 22px;
      font-weight: normal;
      font-style: italic;
      color: var(--gold);
      letter-spacing: 0.03em;
      text-shadow: 0 0 12px rgba(212,168,67,0.3);
      transition: text-shadow 200ms ease;
    }

    .card:hover .card-title {
      text-shadow: 0 0 20px rgba(212,168,67,0.55);
    }

    .card-copy {
      margin: 0;
      font-size: 12px;
      line-height: 1.7;
      color: var(--muted);
      font-style: italic;
    }

    .icon-wrap {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 2px;
      border: 1px solid var(--border);
      color: var(--gold-dim);
      background: rgba(10, 5, 1, 0.8);
      transition: border-color 200ms ease, color 200ms ease, box-shadow 200ms ease;
    }

    .card:hover .icon-wrap {
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 10px rgba(212,168,67,0.25);
    }

    .icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      color: rgba(160, 120, 64, 0.5);
      font-size: 11px;
      font-style: italic;
      background: rgba(8, 4, 1, 0.6);
      letter-spacing: 0.05em;
    }

    /* Staggered card entrance animation */
    .card {
      animation: cardRise 0.6s ease both;
    }
    .cards .card:nth-child(1) { animation-delay: 0.1s; }
    .cards .card:nth-child(2) { animation-delay: 0.22s; }
    .cards .card:nth-child(3) { animation-delay: 0.34s; }

    @keyframes cardRise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .window {
      animation: windowFadeIn 0.5s ease both;
    }
    @keyframes windowFadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to   { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 800px) {
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section class="window" aria-label="卡厄兰入口">
    <div class="titlebar">
      <div class="title">天坑-卡厄兰</div>
      <div class="dots" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <div class="content">
      <h1>天坑-卡厄兰</h1>
      <p>从这里进入的是只读浏览入口。地图、字典和法术库都不会修改本地 Markdown 数据。</p>

      <div class="cards">
        <a class="card" href="./map.html?readonly=1">
          <div class="card-top">
            <h2 class="card-title">地图</h2>
            <span class="icon-wrap">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"></path>
                <path d="M9 3v15"></path>
                <path d="M15 6v15"></path>
              </svg>
            </span>
          </div>

        </a>

        <a class="card" href="./language_dictionary%20.html?readonly=1">
          <div class="card-top">
            <h2 class="card-title">字典</h2>
            <span class="icon-wrap">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 19.5V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-1.5Z"></path>
                <path d="M8 7h8"></path>
                <path d="M8 11h6"></path>
              </svg>
            </span>
          </div>
          <p class="card-copy">搜索和浏览已存入的语言词典，不显示添加、导入、保存和删除入口。</p>
        </a>

        <a class="card" href="./spells.html?readonly=1">
          <div class="card-top">
            <h2 class="card-title">法术库</h2>
            <span class="icon-wrap">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2l2.4 6.8L21 11l-6.6 2.2L12 21l-2.4-7.8L3 11l6.6-2.2L12 2Z"></path>
              </svg>
            </span>
          </div>
          <p class="card-copy">搜索、查看法术卡片和详情，不显示新增或写入 Markdown 的入口。</p>
        </a>
      </div>
    </div>

    <div class="footer">只读入口</div>
  </section>
</body>
</html>
